version: 2
updates:
  # Backend and frontend share the single root package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    labels:
      - dependencies
      - github-actions
