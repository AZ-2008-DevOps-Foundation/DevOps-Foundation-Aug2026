name: CD

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      AZURE_CORE_OUTPUT: none
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'weather' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image prefix
        id: images
        # GHCR rejects uppercase in the namespace, so lowercase the owner.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login
        uses: azure/login@v3
        with:
          # azure/login has no client-secret input; four separate secrets are
          # assembled into the creds JSON it expects.
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          provenance: false
          tags: |
            ${{ steps.images.outputs.prefix }}/weather-backend:${{ github.sha }}
            ${{ steps.images.outputs.prefix }}/weather-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: false
          tags: |
            ${{ steps.images.outputs.prefix }}/weather-frontend:${{ github.sha }}
            ${{ steps.images.outputs.prefix }}/weather-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy Container Apps
        id: deploy
        env:
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${IMAGE_TAG:0:7}" \
            --template-file infra/apps.bicep \
            --only-show-errors \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              backendImage="$IMAGE_PREFIX/weather-backend:$IMAGE_TAG" \
              frontendImage="$IMAGE_PREFIX/weather-frontend:$IMAGE_TAG" \
              azureMapsKey="$AZURE_MAPS_KEY" \
            --query properties.outputs --output json > deployment-outputs.json
          {
            echo "backend_url=$(jq -r .backendUrl.value deployment-outputs.json)"
            echo "frontend_url=$(jq -r .frontendUrl.value deployment-outputs.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify health endpoints
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.deploy.outputs.frontend_url }}
        run: |
          check() {
            for attempt in $(seq 1 20); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$1" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK  $1"
                return 0
              fi
              echo "attempt $attempt: $1 -> HTTP $code"
              sleep 15
            done
            echo "::error::Health check failed for $1"
            return 1
          }
          check "$BACKEND_URL/health"
          check "$FRONTEND_URL/healthz"
          {
            echo "### Deployed"
            echo "- Frontend: $FRONTEND_URL"
            echo "- Backend: $BACKEND_URL"
            echo "- Image tag: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
