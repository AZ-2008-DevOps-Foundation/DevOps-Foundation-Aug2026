name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          # Tests stub every outbound call; the key only satisfies startup config.
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
