name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:backend
        env:
          # Tests stub every outbound call; the key only satisfies startup config.
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:frontend
        env:
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()
    steps:
      # Single required status check to point branch protection at.
      - name: Verify test jobs succeeded
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-tests.result }}
        run: |
          echo "backend-tests: $BACKEND"
          echo "frontend-tests: $FRONTEND"
          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "::error::Unit tests did not pass."
            exit 1
          fi
