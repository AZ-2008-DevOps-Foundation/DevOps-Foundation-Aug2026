name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:backend
        env:
          # Tests stub every outbound call; the key only satisfies startup config.
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:frontend
        env:
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, codeql]
    if: always()
    steps:
      # Single required status check; packaging/deploy jobs should use `needs: [ci]`.
      - name: Verify test and security jobs succeeded
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-tests.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          echo "backend-tests: $BACKEND"
          echo "frontend-tests: $FRONTEND"
          echo "codeql: $CODEQL"
          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "::error::Unit tests did not pass."
            exit 1
          fi
          if [ "$CODEQL" != "success" ]; then
            echo "::error::CodeQL analysis did not pass."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml
    secrets: inherit
