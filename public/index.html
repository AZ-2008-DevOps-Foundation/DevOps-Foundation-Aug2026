<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar bg-primary" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand mb-0 h1" href="#/">🌤️ Weather Dashboard</a>
      </div>
    </nav>

    <main class="container py-4">
      <section id="dashboard-view" hidden>
        <h1 class="h4 mb-1">Current weather</h1>
        <p class="text-body-secondary">Select a city to see its location on the map.</p>
        <div id="dashboard-alert" class="alert alert-danger" role="alert" hidden></div>
        <div id="country-groups" class="vstack gap-4"></div>
      </section>

      <section id="detail-view" hidden>
        <button id="back-button" type="button" class="btn btn-outline-primary mb-3">
          &larr; Back
        </button>
        <div id="detail-alert" class="alert alert-danger" role="alert" hidden></div>

        <div class="card shadow-sm overflow-hidden mb-4">
          <div class="card-body">
            <h1 id="detail-title" class="h4 card-title mb-1 d-flex align-items-center gap-2"></h1>
            <p id="detail-subtitle" class="text-body-secondary mb-3"></p>
            <div class="row g-3 align-items-center">
              <div class="col-auto">
                <span id="detail-emoji" class="display-3" aria-hidden="true"></span>
              </div>
              <div class="col">
                <div id="detail-temperature" class="display-6"></div>
                <div id="detail-condition" class="text-body-secondary"></div>
              </div>
            </div>
            <div
              id="detail-metrics"
              class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3 mt-1"
            ></div>
          </div>
          <div id="detail-map" class="detail-map"></div>
        </div>

        <div class="card shadow-sm">
          <div
            class="card-header bg-body d-flex flex-wrap justify-content-between align-items-center gap-2"
          >
            <h2 class="h6 mb-0">Daily forecast</h2>
            <div class="btn-group btn-group-sm" role="group" aria-label="Forecast range">
              <input
                type="radio"
                class="btn-check"
                name="forecast-range"
                id="forecast-range-5"
                value="5"
                checked
              />
              <label class="btn btn-outline-primary" for="forecast-range-5">5 days</label>
              <input
                type="radio"
                class="btn-check"
                name="forecast-range"
                id="forecast-range-7"
                value="7"
              />
              <label class="btn btn-outline-primary" for="forecast-range-7">7 days</label>
            </div>
          </div>
          <div class="card-body">
            <div id="forecast-alert" class="alert alert-warning" role="alert" hidden></div>
            <div id="forecast-list" class="row g-3"></div>
          </div>
        </div>
      </section>

      <div id="loading" class="text-center py-5" hidden>
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
